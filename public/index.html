<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0f">
  <title data-i18n="app.title">与Qiao对话</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <link rel="preconnect" href="https://fonts.font.im">
  <link rel="preconnect" href="https://gstatic.font.im" crossorigin>
  <link href="https://fonts.font.im/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- History Sidebar -->
  <aside id="history-sidebar" class="history-sidebar">
    <div class="history-header">
      <h3 data-i18n="history.title">对话历史</h3>
      <button id="close-history" class="btn-icon-small">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div id="history-list" class="history-list">
      <div class="history-empty" data-i18n="history.empty">暂无历史对话</div>
    </div>
  </aside>
  <div class="history-overlay" id="history-overlay"></div>

  <div id="app" class="app-container">
    <!-- Header -->
    <header class="chat-header">
      <div class="header-left">
        <span class="logo-icon">◈</span>
        <h1 data-i18n="app.title">与Qiao对话</h1>
      </div>
      <div class="header-right">
        <div class="model-selector">
          <select id="model-select">
            <option value="chatgpt">GPT-5.2</option>
            <option value="gemini">Gemini 3 Flash</option>
          </select>
          <span class="select-arrow">▾</span>
        </div>
        <button id="new-chat-btn" class="btn-icon" data-i18n-title="header.newChat" title="新对话">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
        <button id="history-btn" class="btn-icon" data-i18n-title="header.history" title="历史记录">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </button>
        <button id="lang-toggle" class="btn-icon" title="切换语言 / Switch Language">
          <span>EN</span>
        </button>
        <a id="admin-link" href="/admin.html" class="btn-icon" data-i18n-title="header.admin" title="管理面板" style="display: none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </a>
        <button id="clear-chat" class="btn-icon" data-i18n-title="header.clearChat" title="清空对话">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/>
          </svg>
        </button>
        <button id="logout-btn" class="btn-icon" data-i18n-title="header.logout" title="退出登录">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Chat Messages -->
    <main class="chat-messages" id="chat-messages">
      <div class="welcome-message">
        <div class="welcome-icon">◈</div>
        <h2 data-i18n="welcome.title">欢迎使用与Qiao对话</h2>
        <p data-i18n="welcome.subtitle">选择一个模型开始对话，您可以随时切换模型。</p>
        <div class="model-cards">
          <div class="model-card" data-model="chatgpt">
            <span class="model-badge openai">OpenAI</span>
            <h3>GPT-5.2</h3>
            <p data-i18n="welcome.gpt.desc">最强大的推理和编码能力</p>
          </div>
          <div class="model-card" data-model="gemini">
            <span class="model-badge google">Google</span>
            <h3>Gemini 3 Flash</h3>
            <p data-i18n="welcome.gemini.desc">快速高效的多模态响应</p>
          </div>
        </div>
      </div>
    </main>

    <!-- Input Area -->
    <footer class="chat-input-area">
      <!-- Prompt Builder Toggle -->
      <div class="prompt-builder-toggle">
        <button type="button" id="prompt-builder-btn" class="btn-prompt-builder">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
          <span data-i18n="promptBuilder.toggle">提示词构建器</span>
        </button>
      </div>

      <!-- Prompt Builder Form -->
      <div id="prompt-builder" class="prompt-builder" style="display: none;">
        <div class="prompt-builder-header">
          <h3 data-i18n="promptBuilder.title">提示词构建器</h3>
          <button type="button" id="close-prompt-builder" class="btn-icon-small">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <form id="prompt-form" class="prompt-form">
          <div class="prompt-field">
            <label for="persona-input">
              <span class="label-text">[PERSONA]</span>
              <span class="label-required">*</span>
            </label>
            <textarea
              id="persona-input"
              data-i18n-placeholder="promptBuilder.persona.placeholder"
              placeholder="例如：你是一位经验丰富的写作助手，擅长帮助用户撰写清晰、有条理的文章。"
              rows="2"
            ></textarea>
            <div class="field-hint" data-i18n="promptBuilder.persona.hint">定义AI的角色和专业领域</div>
          </div>

          <div class="prompt-field">
            <label for="task-input">
              <span class="label-text">[TASK]</span>
              <span class="label-required">*</span>
            </label>
            <textarea
              id="task-input"
              data-i18n-placeholder="promptBuilder.task.placeholder"
              placeholder="例如：请帮我写一封给客户的感谢邮件，表达对他们支持的感激之情。"
              rows="3"
            ></textarea>
            <div class="field-hint" data-i18n="promptBuilder.task.hint">描述您需要完成的具体任务</div>
          </div>

          <div class="prompt-field">
            <label for="context-input">
              <span class="label-text">[CONTEXT]</span>
              <span class="label-required">*</span>
            </label>
            <textarea
              id="context-input"
              data-i18n-placeholder="promptBuilder.context.placeholder"
              placeholder="例如：背景：客户刚刚完成了一笔大订单。&#10;受众：长期合作的商业客户。"
              rows="3"
            ></textarea>
            <div class="field-hint" data-i18n="promptBuilder.context.hint">提供背景信息和目标受众</div>
          </div>

          <div class="prompt-field optional">
            <label for="format-input">
              <span class="label-text">[FORMAT]</span>
              <span class="label-optional" data-i18n="promptBuilder.optional">（可选）</span>
            </label>
            <textarea
              id="format-input"
              data-i18n-placeholder="promptBuilder.format.placeholder"
              placeholder="例如：输出格式：正式邮件&#10;长度：200-300字&#10;风格：专业但友好"
              rows="3"
            ></textarea>
            <div class="field-hint" data-i18n="promptBuilder.format.hint">指定输出格式、长度和风格（可选）</div>
          </div>

          <div class="prompt-field optional">
            <label for="references-input">
              <span class="label-text">[REFERENCES]</span>
              <span class="label-optional" data-i18n="promptBuilder.optional">（可选）</span>
            </label>
            <textarea
              id="references-input"
              data-i18n-placeholder="promptBuilder.references.placeholder"
              placeholder="例如：参考风格：简洁大方，避免过于正式的措辞"
              rows="3"
            ></textarea>
            <div class="field-hint" data-i18n="promptBuilder.references.hint">提供参考示例或期望的风格（可选）</div>
          </div>

          <div class="prompt-builder-actions">
            <button type="button" id="clear-prompt-form" class="btn-secondary" data-i18n="promptBuilder.clear">清空</button>
            <button type="button" id="generate-prompt" class="btn-primary" data-i18n="promptBuilder.generate">生成提示词</button>
          </div>
        </form>
      </div>

      <form id="chat-form" class="chat-form">
        <div class="input-wrapper">
          <textarea
            id="message-input"
            data-i18n-placeholder="chat.placeholder"
            placeholder="输入您的消息..."
            rows="1"
            maxlength="32000"
          ></textarea>
          <button type="submit" id="send-btn" class="btn-send" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </div>
        <div class="input-footer">
          <span id="char-count">0 / 32000</span>
          <span class="current-model"><span data-i18n="chat.currentModel">当前模型：</span><strong id="current-model-label">GPT-5.2</strong></span>
        </div>
      </form>
    </footer>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .catch(err => console.log('SW registration failed:', err));
    }
  </script>
</body>
</html>
