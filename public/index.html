<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0f">
  <title>与Qiao对话</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <link rel="preconnect" href="https://fonts.font.im">
  <link rel="preconnect" href="https://gstatic.font.im" crossorigin>
  <link href="https://fonts.font.im/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app" class="app-container">
    <!-- Header -->
    <header class="chat-header">
      <div class="header-left">
        <span class="logo-icon">◈</span>
        <h1>与Qiao对话</h1>
      </div>
      <div class="header-right">
        <div class="model-selector">
          <select id="model-select">
            <option value="chatgpt">GPT-5.2</option>
            <option value="gemini">Gemini 3 Flash</option>
          </select>
          <span class="select-arrow">▾</span>
        </div>
        <a id="admin-link" href="/admin.html" class="btn-icon" title="管理面板" style="display: none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </a>
        <button id="clear-chat" class="btn-icon" title="清空对话">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/>
          </svg>
        </button>
        <button id="logout-btn" class="btn-icon" title="退出登录">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Chat Messages -->
    <main class="chat-messages" id="chat-messages">
      <div class="welcome-message">
        <div class="welcome-icon">◈</div>
        <h2>欢迎使用与Qiao对话</h2>
        <p>选择一个模型开始对话，您可以随时切换模型。</p>
        <div class="model-cards">
          <div class="model-card" data-model="chatgpt">
            <span class="model-badge openai">OpenAI</span>
            <h3>GPT-5.2</h3>
            <p>最强大的推理和编码能力</p>
          </div>
          <div class="model-card" data-model="gemini">
            <span class="model-badge google">Google</span>
            <h3>Gemini 3 Flash</h3>
            <p>快速高效的多模态响应</p>
          </div>
        </div>
      </div>
    </main>

    <!-- Input Area -->
    <footer class="chat-input-area">
      <!-- Prompt Builder Toggle -->
      <div class="prompt-builder-toggle">
        <button type="button" id="prompt-builder-btn" class="btn-prompt-builder">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
          <span>提示词构建器</span>
        </button>
      </div>

      <!-- Prompt Builder Form -->
      <div id="prompt-builder" class="prompt-builder" style="display: none;">
        <div class="prompt-builder-header">
          <h3>提示词构建器</h3>
          <button type="button" id="close-prompt-builder" class="btn-icon-small">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <form id="prompt-form" class="prompt-form">
          <div class="prompt-field">
            <label for="persona-input">
              <span class="label-text">[PERSONA]</span>
              <span class="label-required">*</span>
            </label>
            <textarea
              id="persona-input"
              placeholder="例如：You are a senior software engineer with 10 years of experience in full-stack development."
              rows="2"
            ></textarea>
            <div class="field-hint">定义AI的角色和专业领域</div>
          </div>

          <div class="prompt-field">
            <label for="task-input">
              <span class="label-text">[TASK]</span>
              <span class="label-required">*</span>
            </label>
            <textarea
              id="task-input"
              placeholder="例如：I need you to create a responsive navigation component with dark mode support."
              rows="3"
            ></textarea>
            <div class="field-hint">描述您需要完成的具体任务</div>
          </div>

          <div class="prompt-field">
            <label for="context-input">
              <span class="label-text">[CONTEXT]</span>
              <span class="label-required">*</span>
            </label>
            <textarea
              id="context-input"
              placeholder="例如：Background: This is for a modern web application using React and Tailwind CSS.&#10;Audience: Frontend developers who will maintain this code."
              rows="3"
            ></textarea>
            <div class="field-hint">提供背景信息和目标受众</div>
          </div>

          <div class="prompt-field optional">
            <label for="format-input">
              <span class="label-text">[FORMAT]</span>
              <span class="label-optional">（可选）</span>
            </label>
            <textarea
              id="format-input"
              placeholder="例如：Output format: Code with comments&#10;Length: ~200 lines&#10;Tone: Professional and clear"
              rows="3"
            ></textarea>
            <div class="field-hint">指定输出格式、长度和风格（可选）</div>
          </div>

          <div class="prompt-field optional">
            <label for="references-input">
              <span class="label-text">[REFERENCES]</span>
              <span class="label-optional">（可选）</span>
            </label>
            <textarea
              id="references-input"
              placeholder="例如：Here's an example of what I'm looking for:&#10;[粘贴示例代码或描述期望的风格]"
              rows="3"
            ></textarea>
            <div class="field-hint">提供参考示例或期望的风格（可选）</div>
          </div>

          <div class="prompt-builder-actions">
            <button type="button" id="clear-prompt-form" class="btn-secondary">清空</button>
            <button type="button" id="generate-prompt" class="btn-primary">生成提示词</button>
          </div>
        </form>
      </div>

      <form id="chat-form" class="chat-form">
        <div class="input-wrapper">
          <textarea
            id="message-input"
            placeholder="输入您的消息..."
            rows="1"
            maxlength="32000"
          ></textarea>
          <button type="submit" id="send-btn" class="btn-send" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </div>
        <div class="input-footer">
          <span id="char-count">0 / 32000</span>
          <span class="current-model">当前模型：<strong id="current-model-label">GPT-5.2</strong></span>
        </div>
      </form>
    </footer>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .catch(err => console.log('SW registration failed:', err));
    }
  </script>
</body>
</html>
