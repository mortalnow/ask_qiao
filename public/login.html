<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0f">
  <title>与Qiao对话 - 登录</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-glow"></div>
    
    <div class="login-card">
      <div class="login-header">
        <div class="logo">
          <span class="logo-icon">◈</span>
          <h1>与Qiao对话</h1>
        </div>
        <p class="tagline">多模型 AI 对话界面</p>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">登录</button>
        <button class="auth-tab" data-tab="register">注册</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="login-form active" data-form="login">
        <div class="form-group">
          <label for="login-username">用户名</label>
          <input
            type="text"
            id="login-username"
            name="username"
            placeholder="输入用户名"
            autocomplete="username"
            minlength="2"
            maxlength="30"
            required
          >
        </div>

        <div class="form-group">
          <label for="login-password">密码</label>
          <input
            type="password"
            id="login-password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            minlength="6"
            required
          >
        </div>

        <button type="submit" class="btn-primary">
          <span class="btn-text">登录</span>
          <span class="btn-loader"></span>
        </button>

        <div id="login-error-message" class="error-message"></div>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="login-form" data-form="register">
        <div class="form-group">
          <label for="invite-code">邀请码</label>
          <input
            type="text"
            id="invite-code"
            name="code"
            placeholder="ABC123-XYZ789"
            autocomplete="off"
            spellcheck="false"
            pattern="[A-Z0-9]{6}-[A-Z0-9]{6}"
            required
          >
          <span class="input-hint">格式：XXXXXX-XXXXXX</span>
        </div>

        <div class="form-group">
          <label for="register-username">选择用户名</label>
          <input
            type="text"
            id="register-username"
            name="username"
            placeholder="输入用户名"
            autocomplete="username"
            minlength="2"
            maxlength="30"
            required
          >
        </div>

        <div class="form-group">
          <label for="register-password">密码</label>
          <input
            type="password"
            id="register-password"
            name="password"
            placeholder="••••••••"
            autocomplete="new-password"
            minlength="6"
            required
          >
          <span class="input-hint">至少 6 个字符</span>
        </div>

        <button type="submit" class="btn-primary">
          <span class="btn-text">创建账户</span>
          <span class="btn-loader"></span>
        </button>

        <div id="register-error-message" class="error-message"></div>
      </form>

      <div class="login-footer">
        <p>仅限邀请访问 • 由 GPT 和 Gemini 驱动</p>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .catch(err => console.log('SW registration failed:', err));
    }
  </script>
</body>
</html>
