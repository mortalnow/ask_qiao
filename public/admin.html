<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0f">
  <title>Admin - Ask Qiao</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icons/qiao.png">
  <link rel="apple-touch-icon" href="/icons/qiao.png">
  <link rel="preconnect" href="https://fonts.font.im">
  <link rel="preconnect" href="https://gstatic.font.im" crossorigin>
  <link href="https://fonts.font.im/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .admin-container {
      max-width: 900px;
      margin: 0 auto;
      padding: var(--spacing-lg);
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-xl);
      padding-bottom: var(--spacing-md);
      border-bottom: 1px solid var(--bg-tertiary);
    }
    .admin-section {
      background: var(--bg-secondary);
      border: 1px solid var(--bg-tertiary);
      border-radius: var(--radius-lg);
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-lg);
    }
    .admin-section h2 {
      margin-bottom: var(--spacing-md);
      font-size: 1.2rem;
    }
    .invite-form {
      display: flex;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-md);
    }
    .invite-form input {
      flex: 1;
      max-width: 150px;
    }
    .invite-list {
      display: grid;
      gap: var(--spacing-sm);
    }
    .invite-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--spacing-sm) var(--spacing-md);
      background: var(--bg-tertiary);
      border-radius: var(--radius-md);
      font-family: var(--font-mono);
    }
    .invite-item.used {
      opacity: 0.6;
    }
    .invite-code {
      font-weight: 600;
      color: var(--accent-primary);
    }
    .invite-status {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .btn-delete {
      background: var(--error);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      padding: 4px 12px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .btn-delete:hover {
      opacity: 0.8;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-md);
    }
    .stat-card {
      background: var(--bg-tertiary);
      padding: var(--spacing-md);
      border-radius: var(--radius-md);
      text-align: center;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: 600;
      color: var(--accent-primary);
    }
    .stat-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: var(--spacing-xs);
    }
    /* Extension Requests Styles */
    .extension-list {
      display: grid;
      gap: var(--spacing-md);
    }
    .extension-item {
      padding: var(--spacing-md);
      background: var(--bg-tertiary);
      border-radius: var(--radius-md);
      border-left: 3px solid var(--warning);
    }
    .extension-item.approved {
      border-left-color: var(--success);
      opacity: 0.7;
    }
    .extension-item.rejected {
      border-left-color: var(--error);
      opacity: 0.7;
    }
    .extension-user {
      font-weight: 600;
      color: var(--accent-primary);
      margin-bottom: var(--spacing-xs);
    }
    .extension-meta {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-sm);
    }
    .extension-reason {
      padding: var(--spacing-sm);
      background: var(--bg-primary);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      margin-bottom: var(--spacing-sm);
    }
    .extension-actions {
      display: flex;
      gap: var(--spacing-sm);
      align-items: center;
      flex-wrap: wrap;
    }
    .extension-actions select {
      padding: 6px 10px;
      background: var(--bg-secondary);
      border: 1px solid var(--bg-hover);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.85rem;
    }
    .btn-approve {
      background: var(--success);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-approve:hover {
      opacity: 0.9;
    }
    .btn-reject {
      background: transparent;
      color: var(--error);
      border: 1px solid var(--error);
      border-radius: var(--radius-sm);
      padding: 5px 14px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-reject:hover {
      background: var(--error);
      color: white;
    }
    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status-badge.pending {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
    }
    .status-badge.approved {
      background: rgba(34, 197, 94, 0.2);
      color: var(--success);
    }
    .status-badge.rejected {
      background: rgba(239, 68, 68, 0.2);
      color: var(--error);
    }
    .filter-tabs {
      display: flex;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-md);
    }
    .filter-tab {
      padding: 6px 14px;
      background: var(--bg-tertiary);
      border: none;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .filter-tab.active {
      background: var(--accent-primary);
      color: white;
    }
    .filter-tab:hover:not(.active) {
      background: var(--bg-hover);
    }
    .empty-state {
      text-align: center;
      padding: var(--spacing-lg);
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <div>
        <h1>Admin Panel</h1>
        <p style="color: var(--text-secondary); margin-top: 4px;">Manage invite codes</p>
      </div>
      <div style="display: flex; gap: var(--spacing-sm);">
        <a href="/" class="btn-primary" style="text-decoration: none; display: inline-block;">Back to Chat</a>
        <button id="logout-btn" class="btn-icon">Logout</button>
      </div>
    </div>

    <div class="admin-section">
      <h2>Generate Invite Codes</h2>
      <form id="generate-form" class="invite-form">
        <input 
          type="number" 
          id="code-count" 
          placeholder="Number of codes"
          min="1"
          max="50"
          value="1"
          required
        >
        <button type="submit" class="btn-primary">Generate</button>
      </form>
      <div id="generate-error" class="error-message"></div>
    </div>

    <div class="admin-section">
      <h2>Extension Requests</h2>
      <div id="extension-stats" class="stats"></div>
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="pending">Pending</button>
        <button class="filter-tab" data-filter="approved">Approved</button>
        <button class="filter-tab" data-filter="rejected">Rejected</button>
        <button class="filter-tab" data-filter="all">All</button>
      </div>
      <div id="extension-list" class="extension-list"></div>
    </div>

    <div class="admin-section">
      <h2>Invite Codes</h2>
      <div id="stats" class="stats"></div>
      <div id="invite-list" class="invite-list"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
