<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0f">
  <title>Admin - Ask Qiao</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icons/qiao.png">
  <link rel="apple-touch-icon" href="/icons/qiao.png">
  <link rel="preconnect" href="https://fonts.font.im">
  <link rel="preconnect" href="https://gstatic.font.im" crossorigin>
  <link href="https://fonts.font.im/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .admin-container {
      max-width: 900px;
      margin: 0 auto;
      padding: var(--spacing-lg);
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-xl);
      padding-bottom: var(--spacing-md);
      border-bottom: 1px solid var(--bg-tertiary);
    }
    .admin-header-actions {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }
    .admin-header .btn-back {
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-xs);
      background: var(--bg-tertiary);
      border: 1px solid var(--bg-hover);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 0.875rem;
      padding: var(--spacing-sm) var(--spacing-md);
      text-decoration: none;
      transition: all var(--transition-fast);
      height: 40px;
      box-sizing: border-box;
    }
    .admin-header .btn-back:hover {
      border-color: var(--accent-primary);
      color: var(--text-primary);
    }
    .admin-header .btn-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-tertiary);
      border: 1px solid var(--bg-hover);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .admin-header .btn-icon:hover {
      border-color: var(--error);
      color: var(--error);
    }
    .admin-section {
      background: var(--bg-secondary);
      border: 1px solid var(--bg-tertiary);
      border-radius: var(--radius-lg);
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-lg);
    }
    .admin-section h2 {
      margin-bottom: var(--spacing-md);
      font-size: 1.2rem;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-md);
    }
    .stat-card {
      background: var(--bg-tertiary);
      padding: var(--spacing-md);
      border-radius: var(--radius-md);
      text-align: center;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: 600;
      color: var(--accent-primary);
    }
    .stat-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: var(--spacing-xs);
    }
    /* Extension Requests Styles */
    .extension-list {
      display: grid;
      gap: var(--spacing-md);
    }
    .extension-item {
      padding: var(--spacing-md);
      background: var(--bg-tertiary);
      border-radius: var(--radius-md);
      border-left: 3px solid var(--warning);
    }
    .extension-item.approved {
      border-left-color: var(--success);
      opacity: 0.7;
    }
    .extension-item.rejected {
      border-left-color: var(--error);
      opacity: 0.7;
    }
    .extension-user {
      font-weight: 600;
      color: var(--accent-primary);
      margin-bottom: var(--spacing-xs);
    }
    .extension-meta {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-sm);
    }
    .extension-reason {
      padding: var(--spacing-sm);
      background: var(--bg-primary);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      margin-bottom: var(--spacing-sm);
    }
    .extension-actions {
      display: flex;
      gap: var(--spacing-sm);
      align-items: center;
      flex-wrap: wrap;
    }
    .extension-actions select {
      padding: 6px 10px;
      background: var(--bg-secondary);
      border: 1px solid var(--bg-hover);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.85rem;
    }
    .btn-approve {
      background: var(--success);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-approve:hover {
      opacity: 0.9;
    }
    .btn-reject {
      background: transparent;
      color: var(--error);
      border: 1px solid var(--error);
      border-radius: var(--radius-sm);
      padding: 5px 14px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-reject:hover {
      background: var(--error);
      color: white;
    }
    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status-badge.pending {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
    }
    .status-badge.approved {
      background: rgba(34, 197, 94, 0.2);
      color: var(--success);
    }
    .status-badge.rejected {
      background: rgba(239, 68, 68, 0.2);
      color: var(--error);
    }
    .filter-tabs {
      display: flex;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-md);
    }
    .filter-tab {
      padding: 6px 14px;
      background: var(--bg-tertiary);
      border: none;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .filter-tab.active {
      background: var(--accent-primary);
      color: white;
    }
    .filter-tab:hover:not(.active) {
      background: var(--bg-hover);
    }
    .empty-state {
      text-align: center;
      padding: var(--spacing-lg);
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <div>
        <h1>Admin Panel</h1>
        <p style="color: var(--text-secondary); margin-top: 4px;">Manage extension requests</p>
      </div>
      <div class="admin-header-actions">
        <a href="/" class="btn-back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Back to Chat
        </a>
        <button id="logout-btn" class="btn-icon" title="Logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="admin-section">
      <h2>Extension Requests</h2>
      <div id="extension-stats" class="stats"></div>
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="pending">Pending</button>
        <button class="filter-tab" data-filter="approved">Approved</button>
        <button class="filter-tab" data-filter="rejected">Rejected</button>
        <button class="filter-tab" data-filter="all">All</button>
      </div>
      <div id="extension-list" class="extension-list"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
